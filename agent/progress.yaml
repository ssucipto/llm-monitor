# Project Progress Tracking
# This file tracks the overall progress of the project, including milestones, tasks, and recent work.
# Update this file regularly as work progresses.

project:
  name: llm-monitor
  version: 0.1.12
  started: 2026-10-07
  status: in_progress
  current_milestone: M76
  description: |
    A live local dashboard for whatever LLM engine owns port 8080 (Strata Coder
    or Vulkan llama.cpp). Reads the engine's own HTTP endpoints plus Hermes
    workspace state, and adds a power model, SQLite telemetry, and windowed
    performance analysis. Built on the ACP Enhanced framework.

