# Project Progress Tracking
# This file tracks the overall progress of the project, including milestones, tasks, and recent work.
# Update this file regularly as work progresses.

project:
  name: llm-monitor
  version: 0.3.0
  started: 2026-10-07
  status: in_progress
  current_milestone: M81
  description: |
    A live local dashboard for whatever LLM engine owns port 8080 (Strata Coder
    or Vulkan llama.cpp). Reads the engine's own HTTP endpoints plus Hermes
    workspace state, and adds a power model, SQLite telemetry, and windowed
    performance analysis. Built on the ACP Enhanced framework.

# Milestones represent major phases of the project
milestones:
  - id: M1
    name: Dashboard Bootstrap
    priority: 0
    file: null
    status: completed
    progress: 100
    started: 2026-10-07
    completed: 2026-10-07
    estimated_weeks: 1
    tasks_completed: 1
    tasks_total: 1
    notes: |
      Initial scaffold shipped in commit 85694bc (bootstrap) and fea5c7f
      (identity). No milestone document exists; the milestone is tracked
      here only.
  - id: M71
    name: Token Usage History & Comparison Table
    priority: 1
    file: null
    status: completed
    progress: 100
    started: 2026-10-12
    completed: 2026-10-12
    estimated_weeks: 1
    tasks_completed: 1
    tasks_total: 1
    notes: |
      Pre-implementation audited in audit-11, implemented and verified in audit-12 and review-005.
      Adds total token usage per request, 4-period token history (today, yesterday, this week, this month),
      and 3-row history comparison table (today vs yesterday, this week vs last week, this month vs last month).
  - id: M72
    name: Compact Half-Page HUD & Multi-Tab Interface
    priority: 1
    file: agent/milestones/milestone-72-compact-hud-tab.md
    status: completed
    progress: 100
