# Dependencies and integrations
dependencies:
  external_services:
    - name: LLM engine on port 8080
      status: configured
      notes: |
        Strata Coder or Vulkan llama.cpp; the dashboard reads /health /metrics
        /status /slots /props /v1/models.
  libraries:
    - name: Python standard library
      version: 3.x
      purpose: |
        http.server + sqlite3 only; no third-party packages.
  infrastructure:
    - name: Local SQLite telemetry
      status: ready
      notes: |
        Bounded history (DB_MAX_ROWS 20000) beside server.py; gitignored.

