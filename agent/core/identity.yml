# DO NOT add dynamic content to this file (no dates, no task IDs)
# This file is prompt-cached by the LLM API after first call

project: llm-monitor
type: local-dashboard          # stdlib-served web dashboard (no package manager)
description: >
  A live local dashboard for whatever LLM engine owns port 8080 (Strata Coder
  or Vulkan llama.cpp). Reads the engine's own HTTP endpoints plus Hermes
  workspace state, and adds a power model, SQLite telemetry, and windowed
  performance analysis. Built on the ACP Enhanced framework.

stack:
  - primary: Python            # server.py — standard library only
  - framework: None            # http.server + hand-written front end (HTML/CSS/JS)
  - backend: sqlite3           # bounded telemetry history (local, gitignored)
  - deployment: None           # runs locally on this machine

team: solo-developer
priorities:
  - code-quality
  - correctness
  - maintainability

repo: github.com/ssucipto/llm-monitor
